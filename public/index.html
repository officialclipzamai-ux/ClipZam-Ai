<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipZam — Identify Movies &amp; TV Clips</title>
  <meta name="theme-color" content="#08090D" />
  <link rel="manifest" href="/public/manifest.json" />
  <link rel="icon" type="image/png" href="/file_000000001ea46246e2d811f6ca36795b2.png" />
  <link rel="apple-touch-icon" href="/file_000000001ea46246e2d811f6ca36795b2.png" />
  <style>
    :root {
      --bg: #08090d;
      --card: #12151f;
      --text: #f3f5fa;
      --muted: #9aa3b8;
      --accent: #2d7bff;
      --accent2: #18e0ff;
      --border: #23283a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 4px 0 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="file"],
    textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
    }
    textarea {
      min-height: 84px;
      resize: vertical;
      margin-top: 12px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .status {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    .result-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .meta {
      color: var(--accent2);
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    .overview {
      line-height: 1.5;
      color: var(--text);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/file_000000001ea46246e2d811f6ca36795b2.png" alt="ClipZam logo" />
      <div>
        <h1>ClipZam</h1>
        <p class="sub">Identify movies &amp; TV episodes from clips or clues</p>
      </div>
    </div>

    <form id="clipForm" class="card">
      <label for="mediaFile">Upload a short clip or screenshot (optional)</label>
      <input id="mediaFile" type="file" accept="video/*,audio/*,image/*" />

      <textarea id="clueText" placeholder="Optional: add dialogue, scene details, or actors you remember..."></textarea>

      <button id="submitBtn" type="submit">Identify Clip</button>
      <div id="status" class="status"></div>
    </form>

    <div id="resultCard" class="card" style="display:none;">
      <div id="resultMeta" class="meta"></div>
      <h2 id="resultTitle" class="result-title"></h2>
      <p id="resultOverview" class="overview"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("clipForm");
    const fileInput = document.getElementById("mediaFile");
    const clueInput = document.getElementById("clueText");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const resultCard = document.getElementById("resultCard");
    const resultTitle = document.getElementById("resultTitle");
    const resultMeta = document.getElementById("resultMeta");
    const resultOverview = document.getElementById("resultOverview");

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = String(reader.result).split(",")[1] || "";
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function callProxy(action, payload) {
      const res = await fetch("/api/identify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || "Request failed.");
      }
      return data;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultCard.style.display = "none";
      const file = fileInput.files[0];
      const clue = clueInput.value.trim();

      if (!file && !clue) {
        statusEl.textContent = "Pick a file or enter a clue first.";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = "Analyzing with ClipZam AI...";

      try {
        const parts = [];
        if (file) {
          const data = await fileToBase64(file);
          parts.push({
            inline_data: {
              mime_type: file.type || "application/octet-stream",
              data,
            },
          });
        }
        parts.push({
          text:
            "Identify the movie or TV show (and season/episode if TV) from this clip/clue. " +
            "Reply ONLY as valid JSON with keys: title, media_type (\"movie\" or \"tv\"), year, overview. " +
            (clue ? `Extra clue: ${clue}` : ""),
        });

        const gemData = await callProxy("gemini", {
          contents: [{ parts }],
        });

        const rawText =
          gemData?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleaned = rawText.replace(/```json|```/gi, "").trim();
        let guess = null;
        try {
          guess = JSON.parse(cleaned);
        } catch {
          guess = { title: cleaned || "Unknown", media_type: "movie", year: "", overview: "" };
        }

        let tmdbMatch = null;
        if (guess.title) {
          const endpoint = guess.media_type === "tv" ? "/search/tv" : "/search/movie";
          const tmdbData = await callProxy("tmdb", {
            path: endpoint,
            params: { query: guess.title },
          });
          tmdbMatch = tmdbData?.results?.[0] || null;
        }

        const finalTitle =
          tmdbMatch?.title || tmdbMatch?.name || guess.title || "No match found";
        const releaseDate =
          tmdbMatch?.release_date || tmdbMatch?.first_air_date || guess.year || "";
        const year = releaseDate ? String(releaseDate).slice(0, 4) : "";
        const typeLabel = guess.media_type === "tv" ? "TV Show" : "Movie";

        resultMeta.textContent = [typeLabel, year].filter(Boolean).join(" • ");
        resultTitle.textContent = finalTitle;
        resultOverview.textContent =
          tmdbMatch?.overview || guess.overview || "No synopsis available.";
        resultCard.style.display = "block";
        statusEl.textContent = "Done.";
      } catch (err) {
        statusEl.textContent = err.message || "Something went wrong.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
